name: Offline laboratory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts\prepare_data.py --input data\samples\traces.jsonl --output runs\ci-data
      - run: python scripts\report.py --input examples\illustrative\cost-input.json --output runs\ci-report
      - run: python scripts\check_publication.py
