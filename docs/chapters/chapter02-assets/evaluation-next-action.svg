<svg xmlns="http://www.w3.org/2000/svg" width="760" height="624" viewBox="0 0 760 624" role="img" aria-labelledby="title desc">
<title id="title">評価①：一つのモデルの次の一手を確かめる</title>
<desc id="desc">確認済みの注文・配送情報と返品条件を含む途中の履歴を、一つの評価対象モデルへ渡す。モデルが出したツール呼び出しの指示を採点するが、ツールは実行しない。次の評価問題は用意した別の履歴から始める。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Yu Gothic,Meiryo,Noto Sans JP,sans-serif">
<rect x="24" y="12" width="84" height="32" rx="16" fill="#1d4ed8"/>
<text x="66" y="34" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">評価①</text>
<text x="124" y="36" font-size="24" text-anchor="start" fill="#172033" font-weight="bold">用意された場面で「次の一手」を確かめる</text>
<rect x="24" y="62" width="712" height="132" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="380" y="89" font-size="19" text-anchor="middle" fill="#172033" font-weight="bold">モデルへ渡す：途中までの会話履歴</text>
<text x="380" y="115" font-size="16" text-anchor="middle" fill="#172033">顧客の依頼：「破損した商品を返品して、返金してほしい」</text>
<rect x="46" y="129" width="318" height="34" rx="7" fill="#fff"/>
<rect x="396" y="129" width="318" height="34" rx="7" fill="#fff"/>
<text x="205" y="152" font-size="16" text-anchor="middle" fill="#172033">注文・配送情報は確認済み</text>
<text x="555" y="152" font-size="16" text-anchor="middle" fill="#172033">返品条件も確認済み</text>
<text x="380" y="182" font-size="14" text-anchor="middle" fill="#172033">ここまでの情報は用意する。途中の手順はモデルに実行させない。</text>
<polyline points="380,195 380,224" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="168" y="232" width="424" height="76" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="380" y="262" font-size="20" text-anchor="middle" fill="#172033" font-weight="bold">評価対象モデル</text>
<text x="380" y="288" font-size="17" text-anchor="middle" fill="#172033">次の行動を1回生成</text>
<polyline points="380,309 380,334" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="168" y="342" width="424" height="84" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="380" y="370" font-size="19" text-anchor="middle" fill="#172033" font-weight="bold">ツールを呼ぶ指示</text>
<text x="380" y="394" font-size="16" text-anchor="middle" fill="#172033">例：返金額の計算を依頼</text>
<text x="380" y="416" font-size="15" text-anchor="middle" fill="#172033">対象の注文・商品などを指定</text>
<polyline points="380,427 380,452" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="460" width="712" height="70" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="380" y="489" font-size="19" text-anchor="middle" fill="#172033" font-weight="bold">採点：選んだツールと、渡す情報の適切さ</text>
<text x="380" y="515" font-size="16" text-anchor="middle" fill="#172033">業務ルールに照らして確認した参照例と比べる</text>
<rect x="24" y="546" width="712" height="62" rx="10" fill="#fffbeb"/>
<text x="380" y="572" font-size="18" text-anchor="middle" fill="#172033" font-weight="bold">ツールは実行しない。この場面で評価を終える。</text>
<text x="380" y="596" font-size="14" text-anchor="middle" fill="#172033">次の問題は用意した別の履歴から。前の問題での誤りは持ち越さない。</text>
</g></svg>
